services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afyasasa}
      POSTGRES_USER: ${POSTGRES_USER:-afyasasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afyasasa}
    ports:
      # Host 5433 avoids clash with other local Postgres (e.g. sokoos on 5432).
      # Inside Docker the backend still connects to postgres:5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afyasasa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      # Host 6380 avoids clash with other local Redis (e.g. sokoos on 6379).
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afyasasa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afyasasa123}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afyasasa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afyasasa123}
      S3_BUCKET: ${S3_BUCKET:-afyasasa-clinical-files}
    volumes:
      - ./ops/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8080/minio}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-afyasasa}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-afyasasa123}
      # Hardcoded so a live .env cannot re-enable auto-migrations / demo seed on compose up.
      TYPEORM_MIGRATIONS_RUN: "false"
      AFYASASA_ALLOW_DEMO_SEED: "false"
      AFYASASA_CHARGES_ENABLED: "true"
      AUTH_INACTIVITY_TIMEOUT_SECONDS: "300"
      AUTH_INACTIVITY_WARNING_SECONDS: "60"
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEFAULT_TENANT: ${VITE_DEFAULT_TENANT:-jalaram}
        VITE_HIDE_TENANT_SELECTOR: ${VITE_HIDE_TENANT_SELECTOR:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
