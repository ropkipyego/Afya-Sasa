# Production / internet-facing override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Nginx is published. Database, Redis, MinIO, backend, and frontend
# stay on the internal Docker network.

services:
  postgres:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  minio:
    restart: unless-stopped
    ports: []

  backend:
    restart: unless-stopped
    ports: []
    environment:
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:8080/minio}
      TYPEORM_MIGRATIONS_RUN: "false"
      AFYASASA_ALLOW_DEMO_SEED: "false"

  frontend:
    restart: unless-stopped
    ports: []

  nginx:
    restart: unless-stopped
    ports:
      # Bind locally so host Nginx/Certbot can terminate TLS on :443
      - "127.0.0.1:8080:80"
